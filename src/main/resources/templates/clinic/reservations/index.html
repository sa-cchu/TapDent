                }
            });
        });

            document.getElementById('formPatientNameKana').readOnly = false;
            document.getElementById('formPatientTel').readOnly = false;
            document.querySelectorAll('input[name="patientTypeRadio"]').forEach(r => r.disabled = false);
            document.querySelectorAll('.patient-search-btn').forEach(btn => btn.style.display = '');
            const btnClear = document.getElementById('btnClearPatient');
            if (btnClear) btnClear.style.display = '';

        document.getElementById('btnAddReservation').addEventListener('click', async () => {
            window.editAppointmentId = null;
            document.querySelector('#addApptModal .modal-title').innerText = '予約追加';
            await initApptWizard();
            showStep(1);
            addApptModal.show();
        });

        window.openEditApptModal = async function(encodedJson) {
            const a = JSON.parse(decodeURIComponent(encodedJson));
            window.editAppointmentId = a.appointmentId;
            apptModal.hide();
            
            document.querySelector('#addApptModal .modal-title').innerText = '予約内容の変更';
            await initApptWizard();
            
            if (a.appointMethod) {
                const r = document.querySelector(`input[name="formAppointMethod"][value="${a.appointMethod}"]`);
                if (r) r.checked = true;
            }
            if (a.treatmentId) {
                const r = document.querySelector(`input[name="formTreatmentId"][value="${a.treatmentId}"]`);
                if (r) r.checked = true;
            }
            if (a.dentistId) {
                document.getElementById('formDentistId').value = a.dentistId;
            }
            if (a.chairId) {
                document.getElementById('formChairId').value = a.chairId;
            }
            
            let dateStr = '';
            let timeStr = '';
            if (Array.isArray(a.startAt)) {
                dateStr = `${a.startAt[0]}-${String(a.startAt[1]).padStart(2,'0')}-${String(a.startAt[2]).padStart(2,'0')}`;
                timeStr = `${String(a.startAt[3]).padStart(2,'0')}:${String(a.startAt[4]||0).padStart(2,'0')}`;
            } else if (a.startAt) {
                const dt = new Date(a.startAt);
                dateStr = toLocalISOString(dt);
                timeStr = `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
            }
            
            if (dateStr) {
                const dt = new Date(dateStr);
                modalState.currentViewYear = dt.getFullYear();
                modalState.currentViewMonth = dt.getMonth() + 1;
                document.getElementById('formReservationDate').value = dateStr;
            }
            if (timeStr) {
                document.getElementById('formReservationTime').value = timeStr;
            }
            
            document.getElementById('formPatientName').value = a.patientName || '';
            document.getElementById('formPatientNameKana').value = a.patientNameKana || '';
            document.getElementById('formPatientTel').value = a.patientTel || '';
            document.getElementById('formPatientId').value = a.patientId || '';
            
            // ロック処理
            document.getElementById('formPatientName').readOnly = true;
            document.getElementById('formPatientNameKana').readOnly = true;
            document.getElementById('formPatientTel').readOnly = true;
            document.querySelectorAll('input[name="patientTypeRadio"]').forEach(r => {
                r.disabled = true;
                if (a.visitType === r.value) r.checked = true;
            });
            document.querySelectorAll('.patient-search-btn').forEach(btn => btn.style.display = 'none');
            const btnClear = document.getElementById('btnClearPatient');
            if (btnClear) btnClear.style.display = 'none';
            
            document.getElementById('formPatientComment').value = a.patientComment || '';
            
            showStep(1);
            addApptModal.show();
        };

        const patientSearchModalInstance = new bootstrap.Modal(document.getElementById('patientSearchResultModal'));
        
        document.querySelectorAll('.patient-search-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const target = e.target.dataset.searchTarget;
                let q = '';
                if (target === 'kana') {
                    q = document.getElementById('formPatientNameKana').value;
                } else if (target === 'tel') {
                    q = document.getElementById('formPatientTel').value;
                }
                
                if (!q) {
                    alert('検索キーワードを入力してください');
                    return;
                }
                
                const res = await fetch('/clinic/api/reservations/search-patients?q=' + encodeURIComponent(q));
                const patients = await res.json();
                
                const list = document.getElementById('patientSearchResultList');
                list.innerHTML = '';
                
                if (patients.length === 0) {
                    list.innerHTML = '<div class="list-group-item text-muted">該当する患者が見つかりません</div>';
                } else {
                    patients.forEach(p => {
                        const item = document.createElement('button');
                        item.type = 'button';
                        item.className = 'list-group-item list-group-item-action p-3';
                        item.innerHTML = `
                            <div class="d-flex w-100 justify-content-between align-items-center mb-2">
                                <div>
                                    <span class="fs-5 fw-bold text-primary">${p.name}</span>
                                    <span class="ms-2 text-muted small">${p.kana}</span>
                                </div>
                                <span class="badge bg-light text-dark border"><i class="bi bi-card-text"></i> ${p.patientCode || '未発行'}</span>
                            </div>
                            <div class="text-secondary small d-flex flex-wrap gap-3">
                                <span><i class="bi bi-telephone-fill"></i> ${p.tel}</span>
                                <span><i class="bi bi-person-fill"></i> ${p.gender}</span>
                                <span><i class="bi bi-calendar-event-fill"></i> ${p.birthday}</span>
                            </div>
                        `;
                        item.addEventListener('click', () => {
                            document.getElementById('formPatientId').value = p.patientId;
                            document.getElementById('formPatientName').value = p.name;
                            document.getElementById('formPatientNameKana').value = p.kana;
                            document.getElementById('formPatientTel').value = p.tel;
                            
                            const badge = document.getElementById('accountStatusBadge');
                            if (badge) {
                                badge.className = 'badge bg-success fs-6';
                                badge.innerText = '連携済み';
                            }
                            
                            patientSearchModalInstance.hide();
                        });
                        list.appendChild(item);
                    });
                }
                
                patientSearchModalInstance.show();
            });
        });

        document.getElementById('addReservationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const treatSel = document.querySelector('input[name="formTreatmentId"]:checked').value;
            const trInfo = treatmentsData.find(t => t.treatmentId == treatSel);
            let vType = trInfo ? trInfo.targetPatientType : 'FIRST_VISIT';

            const payload = {
                appointMethod: document.querySelector('input[name="formAppointMethod"]:checked').value,
                visitType: vType === 'EXISTING' ? 'RE_VISIT' : 'FIRST_VISIT',
                treatmentId: parseInt(treatSel),
                dentistId: document.getElementById('formDentistId').value ? parseInt(document.getElementById('formDentistId').value) : null,
                chairId: document.getElementById('formChairId').value ? parseInt(document.getElementById('formChairId').value) : null,
                reservationDate: document.getElementById('formReservationDate').value,
                reservationTime: document.getElementById('formReservationTime').value,
                patientComment: document.getElementById('formPatientComment').value,
                name: document.getElementById('formPatientName').value,
                nameKana: document.getElementById('formPatientNameKana').value,
                tel: document.getElementById('formPatientTel').value,
                patientId: null
            };
            
            if (vType === 'EXISTING') {
                const pId = document.getElementById('formPatientId').value;
                if (pId) {
                    payload.patientId = parseInt(pId);
                }
            }

            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            try {
                const isEdit = !!window.editAppointmentId;
                const url = isEdit ? '/clinic/api/reservations/' + window.editAppointmentId : '/clinic/api/reservations';
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        [csrfHeader]: csrfToken
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                if (data.success) {
                    addApptModal.hide();
                    document.getElementById('addReservationForm').reset();
                    loadView(); // refresh calendar
                    
                    const toastEl = document.getElementById('successToast');
                    const toastBody = toastEl.querySelector('.toast-body');
                    if (toastBody) {
                        toastBody.innerHTML = isEdit ? '<i class="bi bi-check-circle-fill me-2"></i>予約を変更しました' : '<i class="bi bi-check-circle-fill me-2"></i>予約を追加しました';
                    }
                    const toast = new bootstrap.Toast(toastEl, { delay: 3000 });
                    toast.show();
                } else {
                    alert('予約エラー: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                alert('通信エラーが発生しました。');
            }
        });

        // 検索で選択後に手動で名前等を変更した場合は連携を解除する
        ['formPatientName', 'formPatientNameKana', 'formPatientTel'].forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('input', () => {
                    const pIdInput = document.getElementById('formPatientId');
                    if (pIdInput.value) {
                        pIdInput.value = '';
                        const badge = document.getElementById('accountStatusBadge');
                        if (badge) {
                            badge.className = 'badge bg-secondary fs-6';
                            badge.innerText = '未登録';
                        }
                    }
                });
            }
        });
        
        const btnClear = document.getElementById('btnClearPatient');
        if (btnClear) {
            btnClear.addEventListener('click', () => {
                document.getElementById('formPatientName').value = '';
                document.getElementById('formPatientNameKana').value = '';
                document.getElementById('formPatientTel').value = '';
                document.getElementById('formPatientId').value = '';
                const badge = document.getElementById('accountStatusBadge');
                if (badge) {
                    badge.className = 'badge bg-secondary fs-6';
                    badge.innerText = '未登録';
                }
            });
        }

        // Run
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
