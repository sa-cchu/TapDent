<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード | TapDent Admin</title>
    <meta name="description" content="TapDent 管理者ダッシュボード">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:       #6366f1;
            --primary-dark:  #4f46e5;
            --primary-glow:  rgba(99, 102, 241, 0.3);
            --sidebar-bg:    #0f0e17;
            --content-bg:    #13111d;
            --card-bg:       rgba(255,255,255,0.05);
            --border:        rgba(255,255,255,0.08);
            --text-primary:  #f1f5f9;
            --text-secondary:#94a3b8;
            --text-muted:    #64748b;
            --success:       #34d399;
            --success-bg:    rgba(52,211,153,0.12);
            --warn:          #fbbf24;
            --warn-bg:       rgba(251,191,36,0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--content-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ─── サイドバー ─── */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 0 24px 28px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .sidebar-logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .sidebar-logo-text span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-logo-sub {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav-section {
            padding: 0 12px;
            flex: 1;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 0 12px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: rgba(99,102,241,0.15);
            color: var(--primary);
        }

        .nav-item svg {
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 16px 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }

        .admin-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .admin-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }

        .admin-info-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .admin-info-role {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ─── メインコンテンツ ─── */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px 48px;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 36px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* フラッシュメッセージ */
        .flash-success {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--success-bg);
            border: 1px solid rgba(52,211,153,0.3);
            color: var(--success);
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            animation: fadeInDown 0.4s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* カードグリッド */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .stat-card:hover {
            border-color: rgba(99,102,241,0.3);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .stat-icon-purple { background: rgba(99,102,241,0.15); color: #818cf8; }
        .stat-icon-green  { background: rgba(52,211,153,0.15);  color: #34d399; }
        .stat-icon-amber  { background: rgba(251,191,36,0.15);  color: #fbbf24; }
        .stat-icon-pink   { background: rgba(244,114,182,0.15); color: #f472b6; }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* 操作パネル */
        .action-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
        }

        .action-panel-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }

        .action-link:hover {
            background: rgba(99,102,241,0.1);
            border-color: rgba(99,102,241,0.3);
            transform: translateX(4px);
        }

        .action-link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .action-link-icon {
            width: 36px;
            height: 36px;
            background: rgba(99,102,241,0.15);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #818cf8;
        }

        .action-link-arrow {
            color: var(--text-muted);
            transition: color 0.15s;
        }

        .action-link:hover .action-link-arrow {
            color: var(--primary);
        }
    </style>
</head>
<body>

<!-- ─── サイドバー ─── -->
<aside th:replace="~{admin/fragments/sidebar :: sidebar('dashboard')}"></aside>

<!-- ─── メインコンテンツ ─── -->
<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">ダッシュボード</h1>
        <p class="page-subtitle">ようこそ、<span th:text="${admin.name}">管理者</span>さん</p>
    </div>

    <!-- フラッシュメッセージ -->
    <div th:if="${successMessage}" class="flash-success">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
        <span th:text="${successMessage}"></span>
    </div>

    <!-- 統計カード -->
    <div class="cards-grid">
        <div class="stat-card">
            <div class="stat-icon stat-icon-purple">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/>
                </svg>
            </div>
            <div class="stat-value">1</div>
            <div class="stat-label">管理者アカウント</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon stat-icon-green">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/>
                </svg>
            </div>
            <div class="stat-value">Active</div>
            <div class="stat-label">システム状態</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon stat-icon-amber">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4c1.4 0 2.8 1.22 2.8 2.8 0 1.58-1.4 2.8-2.8 2.8-1.4 0-2.8-1.22-2.8-2.8 0-1.58 1.4-2.8 2.8-2.8zm0 10c-2.4 0-4.48-1.2-5.6-3 .04-1.8 3.76-2.8 5.6-2.8s5.56 1 5.6 2.8c-1.12 1.8-3.2 3-5.6 3z"/>
                </svg>
            </div>
            <div class="stat-value" th:text="${admin.role.roleName}">ROLE_ADMIN</div>
            <div class="stat-label">権限レベル</div>
        </div>

        <div class="stat-card">
            <div class="stat-icon stat-icon-pink">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                </svg>
            </div>
            <div class="stat-value" th:text="${admin.loginId}">—</div>
            <div class="stat-label">ログインID</div>
        </div>
    </div>

    <!-- クイックアクション -->
    <div class="action-panel">
        <h2 class="action-panel-title">クイックアクション</h2>
        <div class="action-list">
            <a id="editProfileLink" href="/admin/edit" class="action-link">
                <div class="action-link-left">
                    <div class="action-link-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                    </div>
                    <div>
                        <div style="font-weight:600;">プロフィール編集</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">ユーザー名・パスワードを変更する</div>
                    </div>
                </div>
                <div class="action-link-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </a>

            <a id="registerClinicLink" href="/admin/clinics/register" class="action-link">
                <div class="action-link-left">
                    <div class="action-link-icon" style="background:rgba(52,211,153,0.15);color:#34d399;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                        </svg>
                    </div>
                    <div>
                        <div style="font-weight:600;">新規医院登録</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">新しい歯科医院アカウントを作成する</div>
                    </div>
                </div>
                <div class="action-link-arrow">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                    </svg>
                </div>
            </a>
        </div>
    </div>
</main>

</body>
</html>
