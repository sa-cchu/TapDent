<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<aside th:fragment="sidebar(activeMenu)" class="sidebar">
    <div class="sidebar-logo">
        <div class="sidebar-logo-text">Tap<span>Dent</span></div>
        <div class="sidebar-logo-sub">Admin Portal</div>
    </div>

    <nav class="nav-section">
        <div class="nav-label">メインメニュー</div>

        <a href="/admin/dashboard" class="nav-item" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
            </svg>
            ダッシュボード
        </a>

        <a href="/admin/edit" class="nav-item" th:classappend="${activeMenu == 'edit'} ? 'active' : ''">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/>
            </svg>
            プロフィール編集
        </a>

        <div class="nav-label">医院管理</div>

        <a href="/admin/clinics" class="nav-item" th:classappend="${activeMenu == 'clinics'} ? 'active' : ''">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
            アカウント一覧
        </a>

        <a href="/admin/clinics/register" class="nav-item" th:classappend="${activeMenu == 'register'} ? 'active' : ''">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
            </svg>
            医院登録
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="admin-badge">
            <div class="admin-avatar" th:text="${not #strings.isEmpty(admin.name) ? #strings.substring(admin.name,0,1) : 'A'}">A</div>
            <div>
                <div class="admin-info-name" th:text="${admin.name}">管理者</div>
                <div class="admin-info-role" th:text="${admin.role.roleName}">ROLE_ADMIN</div>
            </div>
        </div>

        <!-- ログアウト -->
        <form th:action="@{/admin/logout}" method="post">
            <button id="logoutBtn" type="submit" class="nav-item" style="color:#f87171;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                </svg>
                ログアウト
            </button>
        </form>
    </div>
</aside>
</body>
</html>
