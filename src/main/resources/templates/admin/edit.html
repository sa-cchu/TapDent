<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール編集 | TapDent Admin</title>
    <meta name="description" content="TapDent 管理者プロフィール編集">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary:       #6366f1;
            --primary-dark:  #4f46e5;
            --primary-glow:  rgba(99, 102, 241, 0.3);
            --sidebar-bg:    #0f0e17;
            --content-bg:    #13111d;
            --card-bg:       rgba(255,255,255,0.05);
            --border:        rgba(255,255,255,0.08);
            --input-bg:      rgba(255,255,255,0.04);
            --input-focus:   rgba(255,255,255,0.07);
            --text-primary:  #f1f5f9;
            --text-secondary:#94a3b8;
            --text-muted:    #64748b;
            --error:         #f87171;
            --error-bg:      rgba(248,113,113,0.12);
            --success:       #34d399;
            --success-bg:    rgba(52,211,153,0.12);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--content-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
        }

        /* ─── サイドバー（ダッシュボードと共通） ─── */
        .sidebar {
            width: 260px;
            min-height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 0;
            position: fixed;
            left: 0; top: 0; bottom: 0;
            z-index: 100;
        }

        .sidebar-logo {
            padding: 0 24px 28px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .sidebar-logo-text {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .sidebar-logo-text span {
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-logo-sub {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav-section { padding: 0 12px; flex: 1; }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 0 12px;
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.15s, color 0.15s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .nav-item:hover { background: rgba(255,255,255,0.06); color: var(--text-primary); }
        .nav-item.active { background: rgba(99,102,241,0.15); color: var(--primary); }

        .sidebar-footer {
            padding: 16px 12px 0;
            border-top: 1px solid var(--border);
            margin-top: 12px;
        }

        .admin-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .admin-avatar {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), #818cf8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }

        .admin-info-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .admin-info-role { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* ─── メインコンテンツ ─── */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px 48px;
            min-height: 100vh;
        }

        .page-header { margin-bottom: 36px; }
        .page-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .page-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 6px; }

        /* ─── フォームカード ─── */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            max-width: 560px;
            margin-bottom: 24px;
        }

        .form-card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-card-title svg { color: #818cf8; }

        .form-group { margin-bottom: 20px; }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .input-wrapper { position: relative; }

        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 11px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input::placeholder { color: rgba(148,163,184,0.4); }

        .form-input:focus {
            border-color: var(--primary);
            background: var(--input-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .form-input.is-error { border-color: var(--error); }
        .form-input.is-error:focus { box-shadow: 0 0 0 3px rgba(248,113,113,0.2); }

        .form-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* エラー・成功メッセージ */
        .field-error {
            font-size: 12px;
            color: var(--error);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .alert {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .alert-error   { background: var(--error-bg);   border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
        .alert-success { background: var(--success-bg); border: 1px solid rgba(52,211,153,0.3);  color: var(--success); }

        /* 区切り線 */
        .section-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px 0;
        }

        /* ボタン */
        .btn-row {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 28px;
        }

        .btn-primary {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            box-shadow: 0 4px 14px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-secondary {
            padding: 12px 24px;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 11px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background 0.15s, color 0.15s;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<aside th:replace="~{admin/fragments/sidebar :: sidebar('edit')}"></aside>

<!-- ─── メインコンテンツ ─── -->
<main class="main-content">
    <div class="page-header">
        <h1 class="page-title">プロフィール編集</h1>
        <p class="page-subtitle">ユーザー名とパスワードを変更できます</p>
    </div>

    <form id="editForm" th:action="@{/admin/edit}" th:object="${adminEditForm}" method="post">

        <!-- ─── 基本情報 ─── -->
        <div class="form-card">
            <div class="form-card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z"/>
                </svg>
                基本情報
            </div>

            <!-- ログインID（読み取り専用） -->
            <div class="form-group">
                <label class="form-label">ログインID</label>
                <input type="text" class="form-input" th:value="${admin.loginId}" readonly
                       style="opacity:0.5;cursor:not-allowed;">
                <p class="form-hint">ログインIDは変更できません</p>
            </div>

            <!-- 表示名 -->
            <div class="form-group">
                <label for="name" class="form-label">表示名 <span style="color:var(--error)">*</span></label>
                <input id="name"
                       type="text"
                       th:field="*{name}"
                       th:class="${#fields.hasErrors('name')} ? 'form-input is-error' : 'form-input'"
                       placeholder="例：山田 太郎"
                       maxlength="20">
                <div class="field-error" th:if="${#fields.hasErrors('name')}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span th:errors="*{name}"></span>
                </div>
            </div>
        </div>

        <!-- ─── パスワード変更 ─── -->
        <div class="form-card">
            <div class="form-card-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                パスワード変更
            </div>

            <!-- 現在のパスワード -->
            <div class="form-group">
                <label for="currentPassword" class="form-label">現在のパスワード <span style="color:var(--error)">*</span></label>
                <input id="currentPassword"
                       type="password"
                       th:field="*{currentPassword}"
                       th:class="${#fields.hasErrors('currentPassword') or currentPasswordError != null} ? 'form-input is-error' : 'form-input'"
                       placeholder="現在のパスワードを入力"
                       autocomplete="current-password">
                <div class="field-error" th:if="${#fields.hasErrors('currentPassword')}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span th:errors="*{currentPassword}"></span>
                </div>
                <div class="field-error" th:if="${currentPasswordError}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span th:text="${currentPasswordError}"></span>
                </div>
                <p class="form-hint">すべての変更を保存するために現在のパスワードが必要です</p>
            </div>

            <hr class="section-divider">

            <!-- 新しいパスワード -->
            <div class="form-group">
                <label for="newPassword" class="form-label">新しいパスワード</label>
                <input id="newPassword"
                       type="password"
                       th:field="*{newPassword}"
                       th:class="${#fields.hasErrors('newPassword')} ? 'form-input is-error' : 'form-input'"
                       placeholder="8文字以上（変更しない場合は空欄）"
                       autocomplete="new-password">
                <div class="field-error" th:if="${#fields.hasErrors('newPassword')}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span th:errors="*{newPassword}"></span>
                </div>
            </div>

            <!-- パスワード確認 -->
            <div class="form-group">
                <label for="confirmPassword" class="form-label">新しいパスワード（確認）</label>
                <input id="confirmPassword"
                       type="password"
                       th:field="*{confirmPassword}"
                       th:class="${confirmPasswordError != null} ? 'form-input is-error' : 'form-input'"
                       placeholder="もう一度入力してください"
                       autocomplete="new-password">
                <div class="field-error" th:if="${confirmPasswordError}">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                    <span th:text="${confirmPasswordError}"></span>
                </div>
            </div>
        </div>

        <!-- 保存ボタン -->
        <div class="btn-row">
            <button id="saveBtn" type="submit" class="btn-primary">
                変更を保存する
            </button>
            <a href="/admin/dashboard" class="btn-secondary">キャンセル</a>
        </div>

    </form>
</main>

</body>
</html>
