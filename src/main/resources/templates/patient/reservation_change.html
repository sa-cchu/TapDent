<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>予約時間の変更 | TapDent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Noto Sans JP', sans-serif; }
        .main-container { max-width: 600px; margin: 2rem auto; }
        
        .calendar-day { cursor: pointer; padding: 10px 0; border-radius: 8px; transition: all 0.2s; position: relative; }
        .calendar-day:hover:not(.disabled) { background-color: #f0f7ff; }
        .calendar-day.disabled { cursor: not-allowed; opacity: 0.5; }
        .calendar-day.selected { background-color: #0d6efd; color: white; }
        .calendar-day .day-num { font-size: 1.1rem; font-weight: bold; }
        .calendar-day .status { font-size: 0.9rem; margin-top: 2px; }
        .calendar-day .status.circle { color: #198754; font-weight: bold; }
        .calendar-day.selected .status.circle { color: white; }
        .calendar-day .status.cross { color: #dc3545; font-weight: bold; }
        .calendar-day.selected .status.cross { color: white; }
        .calendar-row { display: flex; }
        .calendar-col { flex: 1; text-align: center; margin: 2px; }
        
        .time-slot { cursor: pointer; text-align: center; padding: 10px; border: 1px solid #dee2e6; border-radius: 8px; transition: all 0.2s; }
        .time-slot:hover { border-color: #0d6efd; background-color: #f0f7ff; }
        .time-input { display: none; }
        .time-input:checked + .time-slot { background-color: #0d6efd; color: white; border-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container main-container">
        
        <div class="mb-4">
            <a th:href="@{|/patient/${token}/reservation/${appointment.appointmentId}/action|}" class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left me-1"></i>戻る
            </a>
        </div>

        <h3 class="mb-4 fw-bold">予約時間の変更</h3>

        <div id="alertArea" class="alert alert-danger d-none"></div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3 border-bottom pb-2">現在の予約</h5>
                <div class="d-flex mb-2">
                    <div class="text-muted" style="width: 100px;">医院名</div>
                    <div class="fw-bold" th:text="${clinicName}">〇〇歯科</div>
                </div>
                <div class="d-flex mb-2">
                    <div class="text-muted" style="width: 100px;">日時</div>
                    <div class="fw-bold">
                        <span th:text="${#temporals.format(appointment.startAt, 'yyyy年MM月dd日')}"></span>
                        <span th:text="${#temporals.format(appointment.startAt, 'HH:mm')}"></span> 〜
                    </div>
                </div>
                <div class="d-flex">
                    <div class="text-muted" style="width: 100px;">メニュー</div>
                    <div class="fw-bold text-primary" th:text="${appointment.treatmentType.treatmentName}">定期検診</div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-4">新しい日時を選択</h5>

                <!-- Calendar -->
                <div class="mb-4">
                    <label class="form-label fw-bold">日付を選択</label>
                    <div class="calendar-container border rounded p-3 bg-white shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnPrevMonth">&lt; 前月</button>
                            <h5 class="mb-0 fw-bold" id="calendarMonthLabel"></h5>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="btnNextMonth">次月 &gt;</button>
                        </div>
                        <div class="row g-0 text-center fw-bold text-muted mb-2">
                            <div class="col text-danger">日</div>
                            <div class="col">月</div>
                            <div class="col">火</div>
                            <div class="col">水</div>
                            <div class="col">木</div>
                            <div class="col">金</div>
                            <div class="col text-primary">土</div>
                        </div>
                        <div id="calendarGrid">
                            <!-- JS generates calendar days -->
                        </div>
                    </div>
                </div>

                <!-- Time Slots -->
                <div class="mb-4">
                    <label class="form-label fw-bold">時間を選択</label>
                    <div id="loadingSlots" class="text-center py-4 d-none">
                        <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                    </div>
                    <div id="noSlots" class="alert alert-warning d-none">
                        選択した日付には予約可能な空き枠がありません。別の日付をお試しください。
                    </div>
                    <div id="pleaseSelectDate" class="alert alert-secondary text-center">
                        カレンダーから日付を選択してください。
                    </div>
                    <div class="row g-2" id="timeSlotsContainer"></div>
                </div>

            </div>
        </div>

        <form id="changeForm" th:action="@{|/patient/${token}/reservation/${appointment.appointmentId}/change-confirm|}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" id="formDate" name="reservationDate" value="" />
            <input type="hidden" id="formTime" name="reservationTime" value="" />
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm" id="btnSubmitChange" disabled>変更内容を確認する</button>
            </div>
        </form>

    </div>

    <script th:inline="javascript">
        const token = /*[[${token}]]*/ 'token';
        const treatmentId = /*[[${treatmentId}]]*/ 1;
        const appointmentId = /*[[${appointment.appointmentId}]]*/ 1;
        
        const state = {
            currentViewYear: new Date().getFullYear(),
            currentViewMonth: new Date().getMonth() + 1,
            maxReserveMonth: 3,
            reservationDate: null,
            reservationTime: null
        };

        const elAlert = document.getElementById('alertArea');
        const btnSubmitChange = document.getElementById('btnSubmitChange');
        const formDate = document.getElementById('formDate');
        const formTime = document.getElementById('formTime');
        const changeForm = document.getElementById('changeForm');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchInitData();
        });

        function fetchInitData() {
            fetch(`/reserve/${token}/api/init`)
                .then(res => res.json())
                .then(data => {
                    if (data.maxReserveMonth) {
                        state.maxReserveMonth = data.maxReserveMonth;
                    }
                    renderCalendar();
                })
                .catch(() => {
                    // fallback
                    renderCalendar();
                });
        }

        function showError(msg) {
            elAlert.innerText = msg;
            elAlert.classList.remove('d-none');
            window.scrollTo(0, 0);
        }

        document.getElementById('btnPrevMonth').addEventListener('click', () => {
            const current = new Date();
            const minDate = new Date(current.getFullYear(), current.getMonth(), 1);
            const viewDate = new Date(state.currentViewYear, state.currentViewMonth - 1, 1);
            
            if (viewDate > minDate) {
                state.currentViewMonth--;
                if (state.currentViewMonth < 1) {
                    state.currentViewMonth = 12;
                    state.currentViewYear--;
                }
                renderCalendar();
            }
        });

        document.getElementById('btnNextMonth').addEventListener('click', () => {
            const current = new Date();
            const maxDate = new Date(current.getFullYear(), current.getMonth() + state.maxReserveMonth, 1);
            const viewDate = new Date(state.currentViewYear, state.currentViewMonth - 1, 1);
            
            if (viewDate < maxDate) {
                state.currentViewMonth++;
                if (state.currentViewMonth > 12) {
                    state.currentViewMonth = 1;
                    state.currentViewYear++;
                }
                renderCalendar();
            }
        });

        function renderCalendar() {
            document.getElementById('calendarMonthLabel').innerText = `${state.currentViewYear}年 ${state.currentViewMonth}月`;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm text-primary"></div></div>';
            
            fetch(`/reserve/${token}/api/calendar?year=${state.currentViewYear}&month=${state.currentViewMonth}&treatmentId=${treatmentId}`)
                .then(res => res.json())
                .then(statusMap => {
                    const firstDay = new Date(state.currentViewYear, state.currentViewMonth - 1, 1);
                    const lastDay = new Date(state.currentViewYear, state.currentViewMonth, 0);
                    
                    let html = '<div class="calendar-row">';
                    for (let i = 0; i < firstDay.getDay(); i++) {
                        html += '<div class="calendar-col"></div>';
                    }
                    
                    for (let d = 1; d <= lastDay.getDate(); d++) {
                        const dateStr = `${state.currentViewYear}-${String(state.currentViewMonth).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                        const status = statusMap[dateStr] || '-';
                        
                        let dayClass = 'calendar-day';
                        if (status === '-' || status === '×') dayClass += ' disabled';
                        if (state.reservationDate === dateStr) dayClass += ' selected';
                        
                        let statusHtml = '';
                        if (status === '○') statusHtml = '<div class="status circle">〇</div>';
                        else if (status === '×') statusHtml = '<div class="status cross">×</div>';
                        else statusHtml = '<div class="status">-</div>';

                        if ((firstDay.getDay() + d - 1) % 7 === 0 && d !== 1) {
                            html += '</div><div class="calendar-row">';
                        }
                        
                        html += `
                        <div class="calendar-col">
                            <div class="${dayClass}" onclick="${(status === '○') ? `selectDate('${dateStr}')` : ''}">
                                <div class="day-num">${d}</div>
                                ${statusHtml}
                            </div>
                        </div>`;
                    }
                    
                    const remainingCells = 7 - ((firstDay.getDay() + lastDay.getDate()) % 7);
                    if (remainingCells < 7) {
                        for (let i = 0; i < remainingCells; i++) {
                            html += '<div class="calendar-col"></div>';
                        }
                    }
                    html += '</div>';
                    grid.innerHTML = html;
                })
                .catch(() => {
                    grid.innerHTML = '<div class="text-danger text-center py-3">カレンダーの読み込みに失敗しました</div>';
                });
        }

        window.selectDate = function(dateStr) {
            state.reservationDate = dateStr;
            formDate.value = dateStr;
            state.reservationTime = null;
            formTime.value = '';
            btnSubmitChange.disabled = true;
            
            renderCalendar();
            fetchSlots(dateStr);
        };

        function fetchSlots(dateStr) {
            const container = document.getElementById('timeSlotsContainer');
            const noSlots = document.getElementById('noSlots');
            const pleaseSelectDate = document.getElementById('pleaseSelectDate');
            const loading = document.getElementById('loadingSlots');
            
            container.innerHTML = '';
            pleaseSelectDate.classList.add('d-none');
            noSlots.classList.add('d-none');
            loading.classList.remove('d-none');
            
            fetch(`/reserve/${token}/api/slots?date=${dateStr}&treatmentId=${treatmentId}`)
                .then(res => res.json())
                .then(slots => {
                    loading.classList.add('d-none');
                    if (!slots || slots.length === 0) {
                        noSlots.classList.remove('d-none');
                        return;
                    }
                    
                    let html = '';
                    slots.forEach(time => {
                        const timeShort = time.substring(0, 5); // HH:mm
                        html += `
                        <div class="col-4 col-sm-3">
                            <label class="w-100 h-100">
                                <input type="radio" name="slotTime" class="time-input" value="${timeShort}">
                                <div class="time-slot h-100 d-flex align-items-center justify-content-center">
                                    ${timeShort}
                                </div>
                            </label>
                        </div>`;
                    });
                    container.innerHTML = html;
                    
                    document.querySelectorAll('input[name="slotTime"]').forEach(radio => {
                        radio.addEventListener('change', (e) => {
                            state.reservationTime = e.target.value;
                            formTime.value = e.target.value;
                            btnSubmitChange.disabled = false;
                        });
                    });
                })
                .catch(() => {
                    loading.classList.add('d-none');
                    container.innerHTML = '<div class="col-12 text-danger">空き時間の取得に失敗しました</div>';
                });
        }

        changeForm.addEventListener('submit', (e) => {
            if (!state.reservationDate || !state.reservationTime) {
                e.preventDefault();
                showError('日付と時間を選択してください');
                return;
            }
            btnSubmitChange.disabled = true;
            btnSubmitChange.innerText = '処理中...';
        });
    </script>
</body>
</html>
