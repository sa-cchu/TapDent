<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約変更の確認 | TapDent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Noto Sans JP', sans-serif; }
        .main-container { max-width: 600px; margin: 2rem auto; }
        .detail-box {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .detail-row {
            display: flex;
            margin-bottom: 0.75rem;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            width: 100px;
            color: #6c757d;
        }
        .detail-value {
            font-weight: 600;
        }
        .old-time {
            text-decoration: line-through;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container main-container">
        
        <div class="mb-4">
            <a th:href="@{|/patient/${token}/reservation/${appointment.appointmentId}/change|}" class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left me-1"></i>戻る
            </a>
        </div>

        <h3 class="mb-4 fw-bold">変更内容の確認</h3>
        
        <div class="alert alert-info mb-4">
            <i class="bi bi-info-circle-fill me-2"></i>
            以下の内容で予約を変更します。よろしいですか？
        </div>

        <div class="detail-box border-primary">
            <h5 class="fw-bold mb-3 border-bottom pb-2 text-primary">新しい予約日時</h5>
            <div class="detail-row">
                <div class="detail-label">日付</div>
                <div class="detail-value text-primary fs-5" th:text="${#temporals.format(newStartAt, 'yyyy年MM月dd日')}">2026年10月01日</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">時間</div>
                <div class="detail-value text-primary fs-5" th:text="${#temporals.format(newStartAt, 'HH:mm')} + ' 〜'">10:30 〜</div>
            </div>
        </div>

        <div class="detail-box bg-light border-0">
            <h5 class="fw-bold mb-3 border-bottom pb-2 text-muted">元の予約（変更前）</h5>
            <div class="detail-row">
                <div class="detail-label">医院名</div>
                <div class="detail-value" th:text="${appointment.dentalClinic.name}">〇〇歯科</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">メニュー</div>
                <div class="detail-value" th:text="${appointment.treatmentType.treatmentName}">定期検診</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">日時</div>
                <div class="detail-value old-time">
                    <span th:text="${#temporals.format(appointment.startAt, 'yyyy年MM月dd日')}"></span>
                    <span th:text="${#temporals.format(appointment.startAt, 'HH:mm')}"></span> 〜
                </div>
            </div>
        </div>

        <form th:action="@{|/patient/${token}/reservation/${appointment.appointmentId}/change|}" method="post" id="confirmForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <!-- POST from previous page -->
            <input type="hidden" name="reservationDate" th:value="${reservationDate}" />
            <input type="hidden" name="reservationTime" th:value="${reservationTime}" />
            
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm" id="btnSubmit">予約を変更する</button>
            </div>
        </form>

    </div>

    <script>
        document.getElementById('confirmForm').addEventListener('submit', function() {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = '処理中...';
        });
    </script>
</body>
</html>
