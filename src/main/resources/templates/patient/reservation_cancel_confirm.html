<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約のキャンセル確認 | TapDent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Noto Sans JP', sans-serif; }
        .main-container { max-width: 600px; margin: 2rem auto; }
    </style>
</head>
<body>
    <div class="container main-container">
        
        <div class="mb-4">
            <a th:href="@{|/patient/${token}/reservation/${appointment.appointmentId}/action|}" class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left me-1"></i>戻る
            </a>
        </div>

        <h3 class="mb-4 fw-bold text-danger">予約のキャンセル確認</h3>

        <div class="alert alert-warning mb-4">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <strong>以下の予約をキャンセルします。よろしいですか？</strong><br>
            <span class="small">キャンセル操作は取り消すことができません。</span>
        </div>

        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <div class="d-flex mb-3">
                    <div class="text-muted" style="width: 100px;">医院名</div>
                    <div class="fw-bold" th:text="${appointment.dentalClinic.name}">〇〇歯科</div>
                </div>
                <div class="d-flex mb-3">
                    <div class="text-muted" style="width: 100px;">日時</div>
                    <div class="fw-bold">
                        <span th:text="${#temporals.format(appointment.startAt, 'yyyy年MM月dd日')}"></span>
                        <span th:text="${#temporals.format(appointment.startAt, 'HH:mm')}"></span> 〜
                    </div>
                </div>
                <div class="d-flex">
                    <div class="text-muted" style="width: 100px;">メニュー</div>
                    <div class="fw-bold text-primary" th:text="${appointment.treatmentType.treatmentName}">定期検診</div>
                </div>
            </div>
        </div>

        <form th:action="@{|/patient/${token}/reservation/${appointment.appointmentId}/cancel|}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">予約をキャンセルする</button>
            </div>
        </form>

    </div>
</body>
</html>
