# アプリケーション名
spring.application.name=TapDent

# 1. MySQLへの接続設定
spring.datasource.url=jdbc:mysql://localhost:3307/dental_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA/Hibernateの設定（Entityクラスからテーブルを自動生成・更新する）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. DevTools (ホットリロード) 設定
# WindowsホストからLinuxコンテナへのファイルシステムイベント（inotify）が正常に伝達されない場合に備え、
# ファイル変更の監視方法をポーリング方式（2秒間隔）に変更します。
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# 4. ログ設定
# 403 エラーの詳細を調査するため、Spring Security のデバッグログを有効化します
logging.level.org.springframework.security=DEBUG

# 5. メール設定
# 環境変数が設定されていればGmail等を使用、なければlocalhost(MailHog)をフォールバックとして使用
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}