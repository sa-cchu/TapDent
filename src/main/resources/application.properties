# アプリケーション名
spring.application.name=TapDent

# 1. MySQLへの接続設定（環境変数があればそれを優先、なければローカルDocker環境にフォールバック）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/dental_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA/Hibernateの設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. DevTools 設定
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# 4. ログ設定
logging.level.org.springframework.security=DEBUG

# 5. メール設定
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}